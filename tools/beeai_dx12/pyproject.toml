[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mgif-beeai-dx12"
version = "0.1.0"
description = "Restricted BeeAI orchestration for the MGIF DX12 backend"
requires-python = ">=3.11,<3.14"
dependencies = ["beeai-framework==0.1.82"]

[project.scripts]
mgif-beeai-dx12 = "mgif_beeai_dx12.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
